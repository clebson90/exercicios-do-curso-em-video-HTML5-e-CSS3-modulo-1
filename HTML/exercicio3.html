<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Símbolos e Emojis</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    
    <p>Você pode escrever um parágrafo de qualquer jeito, basta colocar tudo no meio do par da tag &lt;p&gt; e &lt;/p&gt;.</p>
    
    <p>Se precisar quebrar o texto em algum lugar específico <br> como esse, você pode usar a tag &lt;br&gt;.</p>

    <h2>Símbolos Especiais</h2>
    <p>
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &delta;
        &Delta;
        &uparrow;
    </p>

    <h2>Emojis</h2>
    <p>
        &#x1F596;
        &#x1F913;
        🔥
        ✅
    </p>
</body>
</html>
